<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087c4c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="若木園"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>若木園 共有収穫管理</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f1e7;color:#18372a}header{background:#fff;padding:12px;position:sticky;top:0;z-index:20}main{padding:8px}.status{display:flex;gap:8px;align-items:center;font-size:13px}.lamp{width:11px;height:11px;border-radius:50%;background:#aaa}.lamp.on{background:#18a558}.stats,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.card,.panel{background:#fff;border-radius:12px;padding:10px}.scroll{overflow:auto;background:#fff;border-radius:15px}.map{position:relative;min-width:680px;aspect-ratio:640/480;background:url('./wakagien-map.png') center/100% 100% no-repeat}.tree{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;padding:0;border:3px solid #087c4c;border-radius:50%;background:#f5fff9dd;font-size:14px;font-weight:800;z-index:5;cursor:pointer;touch-action:manipulation}.tree.ready{background:#fff0cddd;border-color:#d99a09}.tree.done{background:#bdc8c2dd;border-color:#66746c}.tree.sel{outline:5px solid #3ba9ff}.btag{position:absolute;top:42px;left:5px;background:#18372a;color:#fff;border-radius:7px;padding:2px 5px;font-size:11px;pointer-events:none}.panel{margin-top:8px}input,select,button{font-size:18px;min-height:52px;border:1px solid #c8d3cc;border-radius:11px;padding:8px;background:#fff}label{display:block;margin:8px 0}.save{width:100%;background:#087c4c;color:#fff;font-weight:800;font-size:20px;min-height:62px}.history{font-size:14px;border-top:1px solid #ddd;margin-top:12px;padding-top:8px}.history div{padding:5px 0;border-bottom:1px dotted #ddd}.version{text-align:center;color:#66746c;font-size:12px;padding:10px}.warn{background:#fff3cd;padding:8px;border-radius:8px;font-size:13px}</style></head><body><header><b>🍊 若木園｜共有 糖度・収穫管理</b><div class="status"><span id="lamp" class="lamp"></span><span id="conn">接続準備中</span><span id="who"></span></div></header><main><div class="stats"><div class="card">測定 <b id="measured">0/33</b></div><div class="card">平均 <b id="avg">--</b></div><div class="card">収穫済 <b id="harvested">0</b></div></div><div class="actions"><button id="csv" type="button">CSV出力</button></div><div id="warning" class="warn">初回はオンライン接続が必要です。接続すると共有データが表示されます。</div><div class="scroll"><div id="map" class="map"></div></div><div class="panel"><h3 id="title">木をタップして糖度を登録</h3><label>測定者名 <input id="operator" autocomplete="name" placeholder="例：武田"></label><label>糖度 Brix <input id="brix" type="number" inputmode="decimal" step="0.1"></label><label>測定日 <input id="date" type="date"></label><label>状態 <select id="status"><option value="unharvested">未収穫</option><option value="harvested">収穫済</option></select></label><label>収穫日 <input id="hdate" type="date"></label><label>メモ <input id="memo"></label><button class="save" id="save" type="button">✓ 共有保存</button><div class="history"><b>糖度履歴</b><div id="history">木を選択すると表示します</div></div></div><div class="version">若木園 App v4 共有版</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js';
import {getDatabase,ref,onValue,set,push,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyC7PWeVKcBXX7oUSi42BMFs3JXhoMwzC3Q',authDomain:'wakagien.firebaseapp.com',databaseURL:'https://wakagien-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'wakagien',storageBucket:'wakagien.firebasestorage.app',messagingSenderId:'1024842524029',appId:'1:1024842524029:web:b54dde649587156c611814',measurementId:'G-7N554MBH0C'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),rtdb=getDatabase(app);const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);$('date').value=today();$('operator').value=localStorage.getItem('wakagienOperator')||'';
const ids=[...Array(8)].map((_,i)=>`A-${i+1}`).concat([...Array(11)].map((_,i)=>`B-${i+1}`),[...Array(6)].map((_,i)=>`C-${i+1}`),[...Array(8)].map((_,i)=>`D-${i+1}`));let trees={},history={},selected=null,ready=false;
const pos={};function addRow(p,n,y,l,r){for(let i=1;i<=n;i++){const ratio=(n-i)/(n-1);pos[`${p}-${i}`]={x:l+(r-l)*ratio,y}}}addRow('D',8,29,39,85);addRow('C',6,47,50,85);addRow('B',11,65,22,88);addRow('A',8,79,18,85);
function render(){const map=$('map');map.replaceChildren();ids.forEach(id=>{const d=trees[id]||{},p=pos[id],el=document.createElement('button');el.type='button';el.className='tree'+(d.status==='harvested'?' done':(+d.brix>=11?' ready':''))+(selected===id?' sel':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.textContent=id;el.onclick=()=>pick(id);if(d.brix){const s=document.createElement('span');s.className='btag';s.textContent=d.brix+'°';el.appendChild(s)}map.appendChild(el)});const vals=ids.map(id=>Number(trees[id]?.brix)).filter(v=>v>0);$('measured').textContent=vals.length+'/33';$('avg').textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'--';$('harvested').textContent=ids.filter(id=>trees[id]?.status==='harvested').length}
function pick(id){selected=id;const d=trees[id]||{};$('title').textContent='🍊 '+id+' の共有記録';$('brix').value=d.brix||'';$('date').value=d.date||today();$('status').value=d.status||'unharvested';$('hdate').value=d.harvestDate||'';$('memo').value=d.memo||'';renderHistory();render();setTimeout(()=>$('brix').scrollIntoView({behavior:'smooth',block:'center'}),50)}
function renderHistory(){const h=history[selected]||{};const rows=Object.values(h).sort((a,b)=>(b.clientTime||0)-(a.clientTime||0)).slice(0,12);$('history').innerHTML=rows.length?rows.map(x=>`<div>${esc(x.date||'')}　<b>${esc(x.brix||'')} Brix</b>　${esc(x.operator||'')}</div>`).join(''):'履歴なし'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('save').onclick=async()=>{if(!ready)return alert('Firebase接続を確認してください');if(!selected)return alert('先に木を選択してください');const operator=$('operator').value.trim();if(!operator)return alert('測定者名を入力してください');localStorage.setItem('wakagienOperator',operator);const rec={brix:$('brix').value,date:$('date').value,status:$('status').value,harvestDate:$('hdate').value,memo:$('memo').value,operator,updatedAt:serverTimestamp(),clientTime:Date.now()};if(rec.status==='harvested'&&!rec.harvestDate)rec.harvestDate=today();try{await set(ref(rtdb,'wakagien/trees/'+selected),rec);if(rec.brix)await push(ref(rtdb,'wakagien/history/'+selected),{brix:rec.brix,date:rec.date,operator,clientTime:Date.now(),updatedAt:serverTimestamp()});$('save').textContent='✓ 共有保存しました';setTimeout(()=>$('save').textContent='✓ 共有保存',1000)}catch(e){alert('保存できませんでした。通信またはFirebaseルールを確認してください。')}};
function dl(name,text){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}$('csv').onclick=()=>{const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['木番号','糖度Brix','測定日','状態','収穫日','測定者','メモ'],...ids.map(id=>{const d=trees[id]||{};return[id,d.brix||'',d.date||'',d.status==='harvested'?'収穫済':'未収穫',d.harvestDate||'',d.operator||'',d.memo||'']})];dl('若木園_共有収穫管理.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'))};
onAuthStateChanged(auth,user=>{if(user){$('who').textContent='認証済';onValue(ref(rtdb,'.info/connected'),s=>{const on=s.val()===true;$('lamp').classList.toggle('on',on);$('conn').textContent=on?'オンライン':'オフライン'});onValue(ref(rtdb,'wakagien/trees'),s=>{trees=s.val()||{};ready=true;$('warning').style.display='none';render()});onValue(ref(rtdb,'wakagien/history'),s=>{history=s.val()||{};renderHistory()})}});signInAnonymously(auth).catch(e=>{$('warning').textContent='Firebase匿名認証に失敗しました。Authentication設定を確認してください。'});render();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=4'));</script></body></html>
