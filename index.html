<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087c4c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="若木園"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>若木園 みかん収穫管理</title><style>:root{--g:#087c4c;--ink:#18372a}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f4f1e7;color:var(--ink)}header{padding:12px;background:#fff;position:sticky;top:0;z-index:9}main{padding:8px}.stats,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.card,.panel{background:#fff;border-radius:12px;padding:10px}.scroll{overflow:auto;background:#fff;border-radius:15px}.map{position:relative;min-width:680px;aspect-ratio:800/600;background:url(wakagien-map.png) center/100% 100% no-repeat}.tree{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:3px solid var(--g);background:#f5fff9df;font-weight:800}.ready{background:#fff0cddd;border-color:#d99a09}.done{background:#bdc8c2dd;border-color:#66746c}.sel{outline:5px solid #3ba9ff}.b{position:absolute;top:44px;left:7px;background:#18372a;color:white;border-radius:8px;padding:2px 5px;font-size:11px}.panel{margin-top:8px}input,select,button{font-size:18px;min-height:52px;border:1px solid #c8d3cc;border-radius:11px;padding:8px;background:#fff}label{display:block;margin:8px 0}.save{width:100%;background:var(--g);color:#fff;font-weight:800;font-size:21px;min-height:62px}</style></head><body><header><b>🍊 若木園｜糖度・収穫管理</b><div>全33本：A-1〜A-8 / B-1〜B-11 / C-1〜C-6 / D-1〜D-8</div></header><main><div class="stats"><div class="card">測定 <b id="measured">0/33</b></div><div class="card">平均 <b id="avg">--</b></div><div class="card">収穫済 <b id="harvested">0</b></div></div><div class="actions"><button id="backup">バックアップ</button><label style="display:inline"><input id="restore" type="file" accept="application/json" hidden><span style="display:inline-block;padding:15px;background:white;border-radius:11px">復元</span></label><button id="csv">CSV出力</button></div><div class="scroll"><div id="map" class="map"></div></div><div class="panel"><h3 id="title">木をタップして糖度を登録</h3><label>糖度 Brix <input id="brix" type="number" inputmode="decimal" step="0.1"></label><label>測定日 <input id="date" type="date"></label><label>状態 <select id="status"><option value="unharvested">未収穫</option><option value="harvested">収穫済</option></select></label><label>収穫日 <input id="hdate" type="date"></label><label>メモ <input id="memo"></label><button class="save" id="save">✓ 保存して次の木</button></div></main><script>
const ids=[...Array(8)].map((_,i)=>`A-${i+1}`).concat([...Array(11)].map((_,i)=>`B-${i+1}`),[...Array(6)].map((_,i)=>`C-${i+1}`),[...Array(8)].map((_,i)=>`D-${i+1}`));let db=JSON.parse(localStorage.getItem('wakagien33')||'{}'),sel=null;const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);$('date').value=today();const pos={};function row(p,n,y,l,r){for(let i=1;i<=n;i++){let t=(i-1)/(n-1);pos[`${p}-${i}`]={x:r+(l-r)*t,y}}}row('D',8,31,31,85);row('C',6,47,50,85);row('B',11,64,17,90);row('A',8,79,14,88);
function render(){let m=$('map');m.innerHTML='';ids.forEach(id=>{let d=db[id]||{},e=document.createElement('button'),p=pos[id];e.className='tree'+(d.status==='harvested'?' done':(+d.brix>=11?' ready':''))+(sel===id?' sel':'');e.style.left=p.x+'%';e.style.top=p.y+'%';e.textContent=id;if(d.brix){let s=document.createElement('span');s.className='b';s.textContent=d.brix+'°';e.appendChild(s)}e.onclick=()=>pick(id);m.appendChild(e)});let v=ids.map(i=>+db[i]?.brix).filter(Boolean);$('measured').textContent=v.length+'/33';$('avg').textContent=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'--';$('harvested').textContent=ids.filter(i=>db[i]?.status==='harvested').length}function pick(id){sel=id;let d=db[id]||{};$('title').textContent='🍊 '+id;$('brix').value=d.brix||'';$('date').value=d.date||today();$('status').value=d.status||'unharvested';$('hdate').value=d.hdate||'';$('memo').value=d.memo||'';render();$('brix').scrollIntoView({behavior:'smooth',block:'center'});$('brix').focus()}$('save').onclick=()=>{if(!sel)return alert('木を選択してください');db[sel]={brix:$('brix').value,date:$('date').value,status:$('status').value,hdate:$('hdate').value,memo:$('memo').value};if(db[sel].status==='harvested'&&!db[sel].hdate)db[sel].hdate=today();localStorage.setItem('wakagien33',JSON.stringify(db));let n=ids.indexOf(sel);render();if(n<ids.length-1)pick(ids[n+1])};function dl(name,type,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('backup').onclick=()=>dl('若木園_バックアップ.json','application/json',JSON.stringify({version:2,saved:new Date().toISOString(),data:db},null,2));$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);db=x.data||x;localStorage.setItem('wakagien33',JSON.stringify(db));render();alert('復元しました')}catch(_){alert('復元ファイルを確認してください')}};r.readAsText(f)};$('csv').onclick=()=>{let rows=[['木番号','糖度Brix','測定日','状態','収穫日','メモ'],...ids.map(i=>{let d=db[i]||{};return[i,d.brix||'',d.date||'',d.status==='harvested'?'収穫済':'未収穫',d.hdate||'',d.memo||'']})],q=x=>'"'+String(x).replaceAll('"','""')+'"';dl('若木園_収穫管理.csv','text/csv','﻿'+rows.map(r=>r.map(q).join(',')).join('
'))};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');render();</script></body></html>
