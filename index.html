<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087c4c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="若木園"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>若木園 みかん収穫管理</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f1e7;color:#18372a}header{background:#fff;padding:12px;position:sticky;top:0;z-index:20}main{padding:8px}.stats,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.card,.panel{background:#fff;border-radius:12px;padding:10px}.scroll{overflow:auto;background:#fff;border-radius:15px}.map{position:relative;min-width:680px;aspect-ratio:640/480;background:url('./wakagien-map.png') center/100% 100% no-repeat}.tree{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;padding:0;border:3px solid #087c4c;border-radius:50%;background:#f5fff9dd;font-size:14px;font-weight:800;z-index:5;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.15)}.tree.ready{background:#fff0cddd;border-color:#d99a09}.tree.done{background:#bdc8c2dd;border-color:#66746c}.tree.sel{outline:5px solid #3ba9ff}.brix-tag{position:absolute;top:42px;left:5px;background:#18372a;color:#fff;border-radius:7px;padding:2px 5px;font-size:11px;pointer-events:none}.panel{margin-top:8px}input,select,button{font-size:18px;min-height:52px;border:1px solid #c8d3cc;border-radius:11px;padding:8px;background:#fff}label{display:block;margin:8px 0}.save{width:100%;background:#087c4c;color:#fff;font-weight:800;font-size:20px;min-height:62px}.version{text-align:center;color:#66746c;font-size:12px;padding:10px}</style></head><body><header><b>🍊 若木園｜糖度・収穫管理</b><div style="font-size:12px">全33本</div></header><main><div class="stats"><div class="card">測定 <b id="measured">0/33</b></div><div class="card">平均 <b id="avg">--</b></div><div class="card">収穫済 <b id="harvested">0</b></div></div><div class="actions"><button id="backup" type="button">バックアップ</button><label style="display:inline;margin:0"><input id="restore" type="file" accept="application/json" hidden><span style="display:inline-block;padding:14px;background:#fff;border-radius:11px">復元</span></label><button id="csv" type="button">CSV出力</button></div><div class="scroll"><div id="map" class="map"></div></div><div class="panel" id="panel"><h3 id="title">木をタップして糖度を登録</h3><label>糖度 Brix <input id="brix" type="number" inputmode="decimal" step="0.1"></label><label>測定日 <input id="date" type="date"></label><label>状態 <select id="status"><option value="unharvested">未収穫</option><option value="harvested">収穫済</option></select></label><label>収穫日 <input id="hdate" type="date"></label><label>メモ <input id="memo"></label><button class="save" id="save" type="button">✓ 保存して次の木</button></div><div class="version">若木園 App v3</div></main><script>
'use strict';
const ids=[...Array(8)].map((_,i)=>`A-${i+1}`).concat([...Array(11)].map((_,i)=>`B-${i+1}`),[...Array(6)].map((_,i)=>`C-${i+1}`),[...Array(8)].map((_,i)=>`D-${i+1}`));
let db={};try{db=JSON.parse(localStorage.getItem('wakagien33')||'{}')}catch(e){}let selected=null;const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);$('date').value=today();
// Coordinates matched directly to the supplied orchard map. Left = largest number, right = 1.
const pos={};function addRow(prefix,n,y,left,right){for(let i=1;i<=n;i++){const ratio=(n-i)/(n-1);pos[`${prefix}-${i}`]={x:left+(right-left)*ratio,y:y}}}
addRow('D',8,29,39,85);addRow('C',6,47,50,85);addRow('B',11,65,22,88);addRow('A',8,79,18,85);
function render(){const map=$('map');map.replaceChildren();const threshold=11;ids.forEach(id=>{const d=db[id]||{},p=pos[id],el=document.createElement('button');el.type='button';el.className='tree'+(d.status==='harvested'?' done':(+d.brix>=threshold?' ready':''))+(id===selected?' sel':'');el.style.left=p.x+'%';el.style.top=p.y+'%';el.dataset.tree=id;el.textContent=id;el.addEventListener('click',()=>pick(id));if(d.brix){const s=document.createElement('span');s.className='brix-tag';s.textContent=d.brix+'°';el.appendChild(s)}map.appendChild(el)});stats()}
function pick(id){selected=id;const d=db[id]||{};$('title').textContent='🍊 '+id+' の記録';$('brix').value=d.brix||'';$('date').value=d.date||today();$('status').value=d.status||'unharvested';$('hdate').value=d.hdate||'';$('memo').value=d.memo||'';render();setTimeout(()=>$('brix').scrollIntoView({behavior:'smooth',block:'center'}),50)}
function stats(){const vals=ids.map(id=>Number(db[id]?.brix)).filter(v=>v>0);$('measured').textContent=vals.length+'/33';$('avg').textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'--';$('harvested').textContent=ids.filter(id=>db[id]?.status==='harvested').length}
$('save').addEventListener('click',()=>{if(!selected){alert('先に園地図の木をタップしてください');return}db[selected]={brix:$('brix').value,date:$('date').value,status:$('status').value,hdate:$('hdate').value,memo:$('memo').value};if(db[selected].status==='harvested'&&!db[selected].hdate)db[selected].hdate=today();localStorage.setItem('wakagien33',JSON.stringify(db));const idx=ids.indexOf(selected);render();if(idx>=0&&idx<ids.length-1)pick(ids[idx+1])});
function download(name,type,text){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
$('backup').addEventListener('click',()=>download('若木園_バックアップ_v3.json','application/json',JSON.stringify({version:3,saved:new Date().toISOString(),data:db},null,2)));
$('restore').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);db=x.data||x;localStorage.setItem('wakagien33',JSON.stringify(db));render();alert('復元しました')}catch(err){alert('復元ファイルを確認してください')}};r.readAsText(f)});
$('csv').addEventListener('click',()=>{const rows=[['木番号','糖度Brix','測定日','状態','収穫日','メモ'],...ids.map(id=>{const d=db[id]||{};return[id,d.brix||'',d.date||'',d.status==='harvested'?'収穫済':'未収穫',d.hdate||'',d.memo||'']})];const q=x=>'"'+String(x).replaceAll('"','""')+'"';download('若木園_収穫管理.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'))});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?version=3').catch(()=>{}))}render();
</script></body></html>
